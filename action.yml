name: "Ably CDN Deploy"
description: "Deploy SDK build artifacts to prod-cdn.ably.com with semantic versioning"
author: Ably
branding:
  icon: "upload-cloud"
  color: "orange"
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 24
    - run: npm ci --prefix ${{ github.action_path }}
      shell: bash
    - run: npx --prefix ${{ github.action_path }} tsx ${{ github.action_path }}/src/index.ts
      shell: bash
      # Composite actions don't auto-populate INPUT_* env vars (only JS actions do),
      # so we pass the inputs explicitly. The names must use underscores, not hyphens:
      # an env var named INPUT_SOURCE-DIR does not reliably propagate to the child
      # process, which is why the earlier hyphenated attempt still failed with
      # "Input required and not supplied: source-dir". src/index.ts reads these
      # underscore names directly (it does not use @actions/core getInput, whose
      # name mapping would otherwise force the hyphenated INPUT_SOURCE-DIR form).
      env:
        INPUT_SOURCE_DIR: ${{ inputs.source-dir }}
        INPUT_FILE_REGEX: ${{ inputs.file-regex }}
        INPUT_TAG: ${{ inputs.tag }}
        INPUT_BUCKET: ${{ inputs.bucket }}
        INPUT_ROOT: ${{ inputs.root }}
inputs:
  source-dir:
    description: 'Directory containing files to upload (e.g. "dist", "build")'
    required: true
  file-regex:
    description: 'Regex to match files for upload (e.g. "^ably\\.umd\\.cjs$")'
    required: true
  tag:
    description: 'Release tag to deploy (e.g. "1.2.3"). Generates versioned copies: 1, 1.2, 1.2.3'
    required: true
  bucket:
    description: "S3 bucket name"
    required: false
    default: "prod-cdn.ably.com"
  root:
    description: "Root folder inside the S3 bucket"
    required: false
    default: "lib"
